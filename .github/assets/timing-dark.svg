<rect x="226.0" y="234" width="247.0" height="24" rx="6" fill="#404040"/>
<text x="349.5" y="250" font-size="12" fill="#d4d4d4" text-anchor="middle">open: A, then B</text>
<rect x="473.5" y="234.5" width="94.0" height="23" rx="6" fill="none" stroke="#737373" stroke-dasharray="4 3"/>
<text x="520.5" y="250" font-size="12" fill="#d4d4d4" text-anchor="middle">warm 500</text>
<rect x="578.5" y="237" width="36" height="18" fill="#0d1117"/>
<text x="596.5" y="250" font-size="12" fill="#a3a3a3" text-anchor="middle">cold</text>
<rect x="625.5" y="234.5" width="75.0" height="23" rx="6" fill="none" stroke="#737373" stroke-dasharray="4 3"/>
<text x="663.0" y="250" font-size="12" fill="#d4d4d4" text-anchor="middle">waiting</text>
<rect x="701.0" y="234" width="76.0" height="24" rx="6" fill="#404040"/>
<text x="739.0" y="250" font-size="12" fill="#d4d4d4" text-anchor="middle">open</text>
<line x1="359.0" y1="84" x2="359.0" y2="172" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="150.0" y="286" font-size="11" fill="#a3a3a3" text-anchor="middle">0</text>
<text x="245.0" y="286" font-size="11" fill="#a3a3a3" text-anchor="middle">500</text>
<text x="340.0" y="286" font-size="11" fill="#a3a3a3" text-anchor="middle">1000</text>
<text x="435.0" y="286" font-size="11" fill="#a3a3a3" text-anchor="middle">1500</text>
<text x="530.0" y="286" font-size="11" fill="#a3a3a3" text-anchor="middle">2000</text>
<text x="625.0" y="286" font-size="11" fill="#a3a3a3" text-anchor="middle">2500</text>
<text x="720.0" y="286" font-size="11" fill="#a3a3a3" text-anchor="middle">3000</text>
<text x="24" y="310" font-size="12" fill="#a3a3a3">A waits, then B takes over at once and A closes. After 500ms with nothing open, C has to wait again.</text>
</svg>

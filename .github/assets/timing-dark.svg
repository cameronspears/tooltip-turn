<line x1="150" y1="114" x2="796" y2="114" stroke="#262626" stroke-width="1"/>
<text x="24" y="163" font-size="13" fill="#a3a3a3">Tooltip B</text>
<line x1="150" y1="158" x2="796" y2="158" stroke="#262626" stroke-width="1"/>
<text x="24" y="207" font-size="13" fill="#a3a3a3">Tooltip C</text>

<rect x="359.0" y="58" width="114.0" height="24" rx="6" fill="#404040"/>
<text x="416.0" y="74" font-size="12" fill="#d4d4d4" text-anchor="middle">on B</text>
<rect x="625.0" y="58" width="152.0" height="24" rx="6" fill="#404040"/>
<text x="701.0" y="74" font-size="12" fill="#d4d4d4" text-anchor="middle">on C</text>
<rect x="527.0" y="61" width="44" height="18" fill="#0d1117"/>
<text x="549.0" y="74" font-size="12" fill="#a3a3a3" text-anchor="middle">away</text>
<rect x="150.5" y="102.5" width="75.0" height="23" rx="6" fill="none" stroke="#737373" stroke-dasharray="4 3"/>
<text x="188.0" y="118" font-size="12" fill="#d4d4d4" text-anchor="middle">wait 400</text>
<rect x="226.0" y="102" width="133.0" height="24" rx="6" fill="#60a5fa"/>
<text x="292.5" y="118" font-size="12" fill="#0a0a0a" text-anchor="middle">open</text>
<rect x="359.0" y="146" width="114.0" height="24" rx="6" fill="#60a5fa"/>
<text x="416.0" y="162" font-size="12" fill="#0a0a0a" text-anchor="middle">open at once</text>
<rect x="625.5" y="190.5" width="75.0" height="23" rx="6" fill="none" stroke="#737373" stroke-dasharray="4 3"/>
<text x="663.0" y="206" font-size="12" fill="#d4d4d4" text-anchor="middle">wait 400</text>
<rect x="701.0" y="190" width="76.0" height="24" rx="6" fill="#60a5fa"/>
<text x="739.0" y="206" font-size="12" fill="#0a0a0a" text-anchor="middle">open</text>
